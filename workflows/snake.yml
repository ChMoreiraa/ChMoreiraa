name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ChMoreiraa
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00BFFF&color_dots=#161B22,#0D3B66,#145DA0,#1E88E5,#00BFFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00BFFF&color_dots=#161B22,#0D3B66,#145DA0,#1E88E5,#00BFFF

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
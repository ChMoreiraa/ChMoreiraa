name: Robô do perfil

# Redesenha as animações do gráfico de contribuições e publica no ramo `output`:
#   scripts/frota.mjs     -> frota-dark.svg e frota-light.svg (a que está no README)
#   scripts/centopeia.mjs -> centopeia-dark.svg e centopeia-light.svg (a anterior, guardada para voltar)
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Desenhar a frota
        run: node scripts/frota.mjs --usuario "${{ github.repository_owner }}" --saida dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Desenhar a centopeia (reserva)
        run: node scripts/centopeia.mjs --usuario "${{ github.repository_owner }}" --saida dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no ramo output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

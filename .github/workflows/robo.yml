name: Robô do perfil

# Redesenha a batalha arcade sobre o gráfico de contribuições (scripts/arcade.mjs) e
# publica no ramo `output`, de onde o README lê arcade-dark.svg e arcade-light.svg.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Desenhar a batalha
        run: node scripts/arcade.mjs --usuario "${{ github.repository_owner }}" --saida dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no ramo output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
